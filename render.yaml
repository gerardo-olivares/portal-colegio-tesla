# Configuración de despliegue en Render (Blueprint)
# Render lee este archivo y crea el servicio web automáticamente.
services:
  - type: web
    name: portal-colegio-tesla
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: JWT_SECRET
        generateValue: true          # Render genera una clave segura
      - key: MONGODB_URI
        sync: false                  # se captura a mano en el panel de Render
      - key: CORS_ORIGINS
        value: https://gerardo-olivares.github.io
      - key: ADMIN_NOMBRE
        value: Administración Colegio Tesla
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
