<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acceso al portal administrativo del Colegio Tesla.">
  <title>Iniciar sesión | Portal Colegio Tesla</title>
  <link rel="icon" href="img/logo-tesla.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/api.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body class="pagina-login">
  <main class="login">
    <!-- Panel de marca -->
    <section class="login-marca" aria-hidden="true">
      <div class="marca-formas">
        <span class="forma f1">A</span><span class="forma f2">B</span><span class="forma f3">C</span>
        <span class="forma f4"></span><span class="forma f5"></span>
      </div>
      <img src="img/logo-tesla.png" alt="" class="marca-logo" width="552" height="373">
      <p class="marca-frase">Donde el aprendizaje se convierte en <strong>pasión por descubrir</strong></p>
      <svg class="marca-olas" viewBox="0 0 600 120" preserveAspectRatio="none">
        <path d="M0 60 C150 10 300 110 450 60 S600 30 600 30 V120 H0Z" fill="#3fa34d"/>
        <path d="M0 90 C150 50 300 130 450 90 S600 70 600 70 V120 H0Z" fill="#ffffff" opacity=".12"/>
      </svg>
    </section>

    <!-- Formulario -->
    <section class="login-panel" aria-labelledby="titulo-login">
      <div class="login-card">
        <img src="img/logo-tesla.png" alt="Colegio Tesla" class="login-logo-movil" width="552" height="373">
        <h1 id="titulo-login">Portal administrativo</h1>
        <p class="login-sub">Inicia sesión con tu cuenta del colegio para gestionar avisos y solicitudes.</p>

        <div id="alerta" class="alerta" role="alert" hidden></div>

        <form id="form-login" novalidate>
          <div class="campo">
            <label for="email">Correo electrónico</label>
            <div class="input-icono">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4-8 5-8-5V6l8 5 8-5v2Z"/></svg>
              <input type="email" id="email" name="email" autocomplete="username" required placeholder="nombre@colegiotesla.mx" aria-describedby="error-email">
            </div>
            <p id="error-email" class="error-campo" aria-live="polite"></p>
          </div>

          <div class="campo">
            <label for="password">Contraseña</label>
            <div class="input-icono">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 9V7a5 5 0 0 0-10 0v2a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2ZM9 7a3 3 0 0 1 6 0v2H9V7Zm4 9.7V18h-2v-1.3a2 2 0 1 1 2 0Z"/></svg>
              <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••" aria-describedby="error-password">
              <button type="button" id="ver-password" class="btn-ojo" aria-label="Mostrar contraseña" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6.5 5 2.7 8.6 1 12c1.7 3.4 5.5 7 11 7s9.3-3.6 11-7c-1.7-3.4-5.5-7-11-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z"/></svg>
              </button>
            </div>
            <p id="error-password" class="error-campo" aria-live="polite"></p>
          </div>

          <button type="submit" id="btn-entrar" class="btn btn-primario btn-bloque">
            <span class="spinner" aria-hidden="true"></span>
            <span class="btn-texto">Iniciar sesión</span>
          </button>
        </form>

        <p class="login-pie">
          <a href="https://gerardo-olivares.github.io/ColegioTesla/">&larr; Volver al sitio del colegio</a>
        </p>
      </div>
    </section>
  </main>
</body>
</html>
